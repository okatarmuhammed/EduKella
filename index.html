<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#667eea">
<link rel="manifest" href="manifest.json">
<title>EduKella</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a1a;
    --bg2: #0f0f2a;
    --purple: #667eea;
    --purple2: #764ba2;
    --pink: #f093fb;
    --pink2: #f5576c;
    --blue: #4facfe;
    --blue2: #00f2fe;
    --gold: #ffd700;
    --green: #00e676;
    --red: #ff5252;
    --text: #ffffff;
    --text2: rgba(255,255,255,0.7);
    --text3: rgba(255,255,255,0.4);
    --glass: rgba(255,255,255,0.08);
    --glass2: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.15);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --spring: cubic-bezier(0.34,1.56,0.64,1);
    --ease: cubic-bezier(0.4,0,0.2,1);
    --max: 480px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
  }

  #particles {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.15;
    animation: drift linear infinite;
  }

  @keyframes drift {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.15; }
    90% { opacity: 0.1; }
    100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }

  #app-wrapper {
    width: 100%;
    max-width: var(--max);
    min-height: 100vh;
    position: relative;
    z-index: 1;
    box-shadow: 0 0 80px rgba(102,126,234,0.3), 0 0 160px rgba(118,75,162,0.15);
    background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
    overflow: hidden;
  }

  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  @keyframes slideUp {
    from { transform: translateY(60px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    15%     { transform: translateX(-8px); }
    30%     { transform: translateX(8px); }
    45%     { transform: translateX(-6px); }
    60%     { transform: translateX(6px); }
    75%     { transform: translateX(-3px); }
    90%     { transform: translateX(3px); }
  }
  @keyframes floatXP {
    0%   { transform: translateY(0);    opacity: 1; }
    100% { transform: translateY(-60px); opacity: 0; }
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg);    opacity: 1; }
    100% { transform: translateY(110vh)  rotate(720deg); opacity: 0; }
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(102,126,234,0.4); }
    50%     { box-shadow: 0 0 0 12px rgba(102,126,234,0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes logoReveal {
    0%   { transform: scale(0.5) rotate(-10deg); opacity: 0; }
    60%  { transform: scale(1.1) rotate(2deg);  opacity: 1; }
    100% { transform: scale(1)   rotate(0deg);  opacity: 1; }
  }
  @keyframes wordmark {
    0%   { opacity: 0; letter-spacing: 0.5em; }
    100% { opacity: 1; letter-spacing: 0.05em; }
  }
  @keyframes starPop {
    0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
    60%  { transform: scale(1.3) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg);   opacity: 1; }
  }
  @keyframes xpBarGrow {
    from { width: 0; }
    to   { width: 100%; }
  }
  @keyframes comboIn {
    0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
    70%  { transform: scale(1.2) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg);   opacity: 1; }
  }
  @keyframes optionIn {
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes correctFlash {
    0%,100% { box-shadow: 0 0 20px rgba(0,230,118,0.3); }
    50%     { box-shadow: 0 0 40px rgba(0,230,118,0.6); }
  }
  @keyframes wrongShake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-8px); }
    40%     { transform: translateX(8px); }
    60%     { transform: translateX(-5px); }
    80%     { transform: translateX(5px); }
  }

  /* ---- SPLASH ---- */
  .splash {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 24px;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
    animation: fadeIn 0.3s ease;
  }
  .splash-logo {
    font-size: 80px; animation: logoReveal 0.8s var(--spring) forwards;
    filter: drop-shadow(0 0 30px rgba(102,126,234,0.8));
  }
  .splash-title {
    font-size: 42px; font-weight: 900; letter-spacing: 0.05em;
    background: linear-gradient(135deg, #667eea, #f093fb, #4facfe);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    animation: wordmark 0.6s ease 0.5s both;
  }
  .splash-sub {
    color: var(--text2); font-size: 14px; font-weight: 400;
    animation: fadeIn 0.5s ease 1s both;
  }
  .splash-loader {
    width: 60px; height: 4px; background: var(--glass2); border-radius: 2px; overflow: hidden;
    animation: fadeIn 0.5s ease 1s both; margin-top: 8px;
  }
  .splash-loader-bar {
    height: 100%; width: 0; background: linear-gradient(90deg, var(--purple), var(--pink));
    border-radius: 2px; animation: xpBarGrow 1.4s ease 1.1s forwards;
  }

  /* ---- HEADER ---- */
  .header {
    padding: calc(16px + var(--safe-top)) 20px 16px;
    display: flex; align-items: center; gap: 12px;
    background: var(--glass); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .header-logo {
    font-size: 28px; font-weight: 900;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    flex: 1;
  }
  .header-stats { display: flex; align-items: center; gap: 10px; }
  .stat-chip {
    display: flex; align-items: center; gap: 4px; padding: 6px 10px;
    background: var(--glass2); border: 1px solid var(--border); border-radius: 20px;
    font-size: 13px; font-weight: 600;
  }
  .xp-bar-wrap {
    padding: 8px 20px 12px; background: var(--glass); border-bottom: 1px solid var(--border);
  }
  .xp-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; font-weight: 500; }
  .xp-bar-bg {
    height: 8px; background: var(--glass2); border-radius: 4px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .xp-bar-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    transition: width 0.8s var(--ease);
    box-shadow: 0 0 10px rgba(102,126,234,0.6);
  }

  /* ---- HOME ---- */
  .home { animation: slideUp 0.4s var(--spring); flex: 1; }
  .home-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
  .section-label {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text3); margin-bottom: 10px;
  }
  .daily-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .daily-card {
    background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px; text-align: center;
    transition: transform 0.3s var(--spring);
  }
  .daily-card:active { transform: scale(0.96); }
  .daily-card-icon { font-size: 24px; margin-bottom: 4px; }
  .daily-card-val { font-size: 20px; font-weight: 800; }
  .daily-card-lbl { font-size: 10px; color: var(--text3); font-weight: 500; }

  .category-card {
    border-radius: 20px; padding: 24px 20px; cursor: pointer; position: relative; overflow: hidden;
    transition: transform 0.3s var(--spring), box-shadow 0.3s ease;
    border: 1px solid rgba(255,255,255,0.2);
    animation: slideUp 0.4s var(--spring) both;
    margin-bottom: 12px;
  }
  .category-card::before {
    content: ''; position: absolute; inset: 0;
    background: rgba(0,0,0,0.15); transition: opacity 0.3s;
  }
  .category-card:hover::before { opacity: 0; }
  .category-card:active { transform: scale(0.97); }
  .category-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  .cat-emoji { font-size: 48px; margin-bottom: 8px; display: block; position: relative; z-index: 1; }
  .cat-name { font-size: 22px; font-weight: 800; position: relative; z-index: 1; }
  .cat-sub { font-size: 13px; opacity: 0.8; position: relative; z-index: 1; margin-top: 4px; }
  .cat-progress {
    margin-top: 14px; position: relative; z-index: 1;
    height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden;
  }
  .cat-progress-fill {
    height: 100%; background: rgba(255,255,255,0.8); border-radius: 3px;
    transition: width 0.8s var(--ease);
  }
  .cat-progress-label { font-size: 11px; opacity: 0.8; margin-top: 6px; position: relative; z-index: 1; }

  /* ---- LEVEL MAP ---- */
  .level-map { animation: slideUp 0.4s var(--spring); flex: 1; display: flex; flex-direction: column; }
  .level-map-header {
    padding: calc(16px + var(--safe-top)) 20px 16px;
    display: flex; align-items: center; gap: 12px;
    background: var(--glass); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .back-btn {
    width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--glass2); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; transition: all 0.3s var(--spring); flex-shrink: 0;
  }
  .back-btn:active { transform: scale(0.9); }
  .level-map-title { font-size: 20px; font-weight: 700; flex: 1; }
  .level-map-body {
    padding: 30px 20px calc(30px + var(--safe-bottom)); flex: 1;
    display: flex; flex-direction: column; align-items: center;
    overflow-y: auto;
  }
  .level-node-wrap {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 320px;
  }
  .level-connector {
    width: 3px; height: 40px;
    background: repeating-linear-gradient(to bottom, var(--border) 0, var(--border) 6px, transparent 6px, transparent 12px);
  }
  .level-node {
    width: 100%; border-radius: 20px; padding: 18px 20px;
    background: var(--glass); backdrop-filter: blur(20px); border: 1.5px solid var(--border);
    cursor: pointer; transition: all 0.3s var(--spring); position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 16px;
  }
  .level-node:hover { transform: translateX(4px); box-shadow: var(--shadow); }
  .level-node:active { transform: scale(0.98); }
  .level-node.unlocked { border-color: rgba(102,126,234,0.5); }
  .level-node.locked { opacity: 0.6; }
  .level-node.completed { border-color: rgba(0,230,118,0.5); }
  .level-node-icon {
    width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center;
    justify-content: center; font-size: 26px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--purple), var(--purple2));
  }
  .level-node.completed .level-node-icon { background: linear-gradient(135deg, #00e676, #00b0ff); }
  .level-node.locked .level-node-icon { background: linear-gradient(135deg, #333, #444); }
  .level-node-info { flex: 1; min-width: 0; }
  .level-node-name { font-size: 15px; font-weight: 700; }
  .level-node-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .level-node-badge {
    font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 8px;
    background: rgba(102,126,234,0.2); color: var(--purple); border: 1px solid rgba(102,126,234,0.3);
    white-space: nowrap; flex-shrink: 0;
  }
  .level-node.completed .level-node-badge {
    background: rgba(0,230,118,0.15); color: var(--green); border-color: rgba(0,230,118,0.3);
  }
  .level-node-lock { font-size: 20px; flex-shrink: 0; margin-left: 4px; }
  .stars-row { display: flex; gap: 2px; margin-top: 4px; }
  .star-sm { font-size: 12px; }

  /* ---- QUIZ ---- */
  .quiz { animation: slideUp 0.4s var(--spring); flex: 1; display: flex; flex-direction: column; }
  .quiz-header {
    padding: calc(12px + var(--safe-top)) 20px 12px;
    background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
  }
  .quiz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .quiz-progress-bg {
    flex: 1; height: 8px; background: var(--glass2); border-radius: 4px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .quiz-progress-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--purple), var(--pink));
    transition: width 0.5s var(--ease);
    box-shadow: 0 0 8px rgba(102,126,234,0.6);
  }
  .quiz-stats { display: flex; align-items: center; gap: 8px; }
  .hearts-display { display: flex; gap: 3px; }
  .heart { font-size: 18px; transition: all 0.3s var(--spring); display: inline-block; }
  .heart.lost { opacity: 0.2; filter: grayscale(1); }
  .heart.shake { animation: shake 0.5s ease; }
  .combo-badge {
    display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;
    background: linear-gradient(135deg, #ff6b35, #f7c59f);
    color: #000; animation: comboIn 0.4s var(--spring);
    box-shadow: 0 2px 12px rgba(255,107,53,0.5);
  }
  .quiz-body {
    flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px;
    overflow-y: auto; padding-bottom: calc(20px + var(--safe-bottom));
  }
  .question-num { font-size: 12px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
  .question-card {
    background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border);
    border-radius: 20px; padding: 22px; min-height: 110px; display: flex; align-items: center;
    animation: popIn 0.4s var(--spring);
  }
  .question-text { font-size: 16px; font-weight: 600; line-height: 1.6; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    width: 100%; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--border);
    background: var(--glass); backdrop-filter: blur(20px); color: var(--text);
    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; text-align: left; transition: all 0.3s var(--spring);
    display: flex; align-items: center; gap: 12px;
    opacity: 0; transform: translateX(-20px);
    animation: optionIn 0.4s var(--spring) forwards;
  }
  .option-letter {
    width: 28px; height: 28px; border-radius: 8px; background: var(--glass2);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0; transition: all 0.3s ease;
  }
  .option-btn:hover:not(:disabled) { transform: translateX(4px); border-color: rgba(102,126,234,0.5); background: var(--glass2); }
  .option-btn:active:not(:disabled) { transform: scale(0.98); }
  .option-btn.correct {
    border-color: var(--green); background: rgba(0,230,118,0.15);
    transform: scale(1.02); box-shadow: 0 0 20px rgba(0,230,118,0.3);
    animation: correctFlash 0.5s ease;
  }
  .option-btn.correct .option-letter { background: var(--green); border-color: var(--green); color: #000; }
  .option-btn.wrong {
    border-color: var(--red); background: rgba(255,82,82,0.15);
    animation: wrongShake 0.5s ease;
  }
  .option-btn.wrong .option-letter { background: var(--red); border-color: var(--red); color: #fff; }
  .explanation-card {
    border-radius: 16px; padding: 14px 16px; font-size: 13px; line-height: 1.5;
    animation: slideUp 0.4s var(--spring); border: 1px solid;
  }
  .explanation-card.correct-exp { background: rgba(0,230,118,0.1); border-color: rgba(0,230,118,0.3); color: #80ffb0; }
  .explanation-card.wrong-exp { background: rgba(255,82,82,0.1); border-color: rgba(255,82,82,0.3); color: #ffaaaa; }
  .next-btn {
    padding: 16px 24px; border-radius: 16px; border: none;
    background: linear-gradient(135deg, var(--purple), var(--purple2));
    color: #fff; font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 700;
    cursor: pointer; width: 100%; transition: all 0.3s var(--spring);
    box-shadow: 0 4px 20px rgba(102,126,234,0.4); animation: slideUp 0.4s var(--spring);
  }
  .next-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(102,126,234,0.5); }
  .next-btn:active { transform: scale(0.97); }

  /* floating XP */
  .float-xp {
    position: fixed; font-size: 18px; font-weight: 800; color: var(--gold);
    pointer-events: none; z-index: 9999;
    text-shadow: 0 0 20px rgba(255,215,0,0.8);
    animation: floatXP 1.2s ease forwards;
  }

  /* ---- RESULT ---- */
  .result {
    animation: slideUp 0.4s var(--spring); flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 30px 20px calc(30px + var(--safe-bottom)); gap: 18px;
  }
  .result-emoji { font-size: 80px; animation: logoReveal 0.6s var(--spring); }
  .result-title { font-size: 28px; font-weight: 900; text-align: center; }
  .result-stars { display: flex; gap: 8px; justify-content: center; }
  .result-star { font-size: 40px; opacity: 0; animation: starPop 0.5s var(--spring) forwards; }
  .result-star.empty { filter: grayscale(1) brightness(0.3); }
  .result-xp-card {
    background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px 30px; text-align: center; width: 100%; max-width: 320px;
    animation: popIn 0.5s var(--spring) 0.3s both;
  }
  .result-xp-num { font-size: 36px; font-weight: 900; color: var(--gold); }
  .result-xp-lbl { font-size: 13px; color: var(--text2); }
  .result-score-row { display: flex; justify-content: center; gap: 24px; margin-top: 14px; }
  .result-stat { text-align: center; }
  .result-stat-val { font-size: 24px; font-weight: 800; }
  .result-stat-lbl { font-size: 11px; color: var(--text3); }
  .result-btns { display: flex; gap: 12px; width: 100%; max-width: 340px; }
  .btn-secondary {
    flex: 1; padding: 14px; border-radius: 16px; border: 1.5px solid var(--border);
    background: var(--glass); color: var(--text); font-family: 'Poppins', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s var(--spring);
  }
  .btn-secondary:hover { background: var(--glass2); transform: translateY(-2px); }
  .btn-primary {
    flex: 2; padding: 14px; border-radius: 16px; border: none;
    background: linear-gradient(135deg, var(--purple), var(--purple2));
    color: #fff; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.3s var(--spring); box-shadow: 0 4px 20px rgba(102,126,234,0.4);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(102,126,234,0.5); }
  .btn-primary:active { transform: scale(0.97); }

  /* confetti */
  .confetti-piece {
    position: fixed; pointer-events: none; z-index: 9998;
    animation: confettiFall linear forwards; border-radius: 2px;
  }

  /* ---- NO HEARTS ---- */
  .no-hearts {
    animation: slideUp 0.4s var(--spring); flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 30px; gap: 18px; text-align: center;
  }
  .no-hearts-emoji { font-size: 80px; animation: pulse 1.5s ease infinite; }
  .no-hearts-title { font-size: 28px; font-weight: 900; }
  .no-hearts-sub { font-size: 14px; color: var(--text2); max-width: 280px; line-height: 1.6; }

  /* ---- PAYWALL ---- */
  .paywall-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
    z-index: 1000; display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.3s ease; padding-bottom: var(--safe-bottom);
  }
  .paywall-sheet {
    width: 100%; max-width: var(--max); background: #13132a;
    border-radius: 28px 28px 0 0; border-top: 1px solid var(--border);
    padding: 28px 24px 32px; animation: slideUp 0.4s var(--spring);
    max-height: 90vh; overflow-y: auto;
  }
  .paywall-handle {

// ============================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getQuestions(cat, level) {
  const pool = QUESTIONS[cat][level] || [];
  let s = shuffle(pool);
  while (s.length < 5) s = [...s, ...shuffle(pool)];
  return s.slice(0, 5);
}

function calcStars(correct) {
  return correct >= 5 ? 3 : correct >= 3 ? 2 : 1;
}

function initParticles() {
  const container = document.getElementById('particles');
  const colors = ['#667eea','#764ba2','#f093fb','#4facfe','#00f2fe','#f5576c','#ffd700'];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 60 + 20;
    p.style.cssText = [
      `width:${size}px`,
      `height:${size}px`,
      `left:${Math.random()*100}%`,
      `background:${colors[Math.floor(Math.random()*colors.length)]}`,
      `animation-duration:${Math.random()*20+15}s`,
      `animation-delay:-${Math.random()*20}s`,
      `filter:blur(${Math.random()*10+5}px)`
    ].join(';');
    container.appendChild(p);
  }
}

    case 'home':     app.innerHTML = renderHome();     break;
    case 'map':      app.innerHTML = renderMap();      break;
    case 'quiz':     app.innerHTML = renderQuiz();     break;
    case 'result':   app.innerHTML = renderResult();   break;
    case 'nohearts': app.innerHTML = renderNoHearts(); break;
  }

  // Paywall overlay
  const existing = document.getElementById('paywall-overlay');
  if (state.showPaywall) {
    if (!existing) {
      document.getElementById('app-wrapper').insertAdjacentHTML('beforeend', renderPaywall());
    }
  } else {
    if (existing) existing.remove();
  }

  attachEvents();
}

// ============================================================
// SCREENS
// ============================================================
function renderSplash() {
  return `<div class="splash">
    <div class="splash-logo">🎓</div>
    <div class="splash-title">EduKella</div>
    <div class="splash-sub">Öğrenmenin en eğlenceli yolu</div>

  </div>`;
}

function renderHome() {

  let catCards = '';

    catCards += `<div class="category-card" data-cat="${key}" style="background:${cat.grad};animation-delay:${0.08*(idx+1)}s">
      <span class="cat-emoji">${cat.emoji}</span>
      <div class="cat-name">${cat.label}</div>

      <div class="cat-progress"><div class="cat-progress-fill" style="width:${prog}%"></div></div>

    <div class="header">
      <div class="header-logo">EduKella</div>
      <div class="header-stats">
        <div class="stat-chip">🔥 ${persist.streak}</div>
        <div class="stat-chip">❤️ ${persist.hearts}</div>
        <div class="stat-chip">⭐ ${persist.xp}</div>
      </div>
    </div>
    <div class="xp-bar-wrap">
      <div class="xp-label">Seviye ${xpLevel} &bull; ${persist.xp % 500}/500 XP</div>
      <div class="xp-bar-bg"><div class="xp-bar-fill" style="width:${xpPct}%"></div></div>
    </div>
    <div class="home-body">
      <div>
        <div class="section-label">Günlük Durum</div>
        <div class="daily-stats">
          <div class="daily-card">
            <div class="daily-card-icon">🔥</div>
            <div class="daily-card-val">${persist.streak}</div>
            <div class="daily-card-lbl">Gün Serisi</div>
          </div>
          <div class="daily-card">
            <div class="daily-card-icon">❤️</div>
            <div class="daily-card-val">${persist.hearts}</div>
            <div class="daily-card-lbl">Can</div>
          </div>
          <div class="daily-card">
            <div class="daily-card-icon">⭐</div>

function renderMap() {
  const cat = CATEGORIES[state.category];
  const unlocked = persist.unlocked[state.category] || [1];
  const catStars = persist.stars[state.category] || {};

  let nodes = '';
  for (let i = 1; i <= 5; i++) {
    const lv = LEVELS[i];
    const isUnlocked = unlocked.includes(i);
    const isCompleted = catStars[i] > 0;
    const isPremiumLocked = i > 1 && !persist.premium;
    const isHardLocked = !isUnlocked && !isPremiumLocked;

    let cls = 'locked';
    if (isCompleted) cls = 'completed';
    else if (isUnlocked) cls = 'unlocked';

    const starsHtml = isCompleted
      ? `<div class="stars-row">${[1,2,3].map(s => `<span class="star-sm">${s <= catStars[i] ? '⭐' : '☆'}</span>`).join('')}</div>`
      : '';

    let badge = 'Kilitli';
    if (isCompleted) badge = '✓ Bitti';
    else if (isUnlocked) badge = 'Oyna';

    let lockIcon = '';
    if (isPremiumLocked) lockIcon = '<span class="level-node-lock">👑</span>';
    else if (isHardLocked) lockIcon = '<span class="level-node-lock">🔒</span>';

    nodes += `
      ${i > 1 ? '<div class="level-connector"></div>' : ''}
      <div class="level-node ${cls}" data-level="${i}">
        <div class="level-node-icon">${lv.icon}</div>
        <div class="level-node-info">
          <div class="level-node-name">Seviye ${i} — ${lv.name}</div>
          <div class="level-node-sub">+${lv.xpReward} XP${isPremiumLocked ? ' &bull; Premium' : ''}</div>
          ${starsHtml}
        </div>
        <span class="level-node-badge">${badge}</span>
        ${lockIcon}
      </div>`;
  }

  return `<div class="level-map">
    <div class="level-map-header">
      <div class="back-btn" id="back-home">&#8592;</div>
      <div style="font-size:28px">${cat.emoji}</div>
      <div class="level-map-title">${cat.label}</div>
    </div>
    <div class="level-map-body">
      <div class="level-node-wrap">${nodes}</div>
    </div>
  </div>`;
}

function renderQuiz() {
  const q = state.questions[state.qIndex];
  const progress = (state.qIndex / state.questions.length) * 100;
  const letters = ['A','B','C','D'];

  // Hearts
  let heartsHtml = '';
  for (let i = 0; i < 5; i++) {
    const lost = i >= persist.hearts;
    heartsHtml += `<span class="heart${lost ? ' lost' : ''}">${lost ? '🖤' : '❤️'}</span>`;
  }

  // Options
  const optionsHtml = q.options.map((opt, i) => {
    let cls = 'option-btn';
    if (state.answered) {
      if (i === q.correct) cls += ' correct';
      else if (i === state.selected) cls += ' wrong';
    }
    return `<button class="${cls}" data-opt="${i}" style="animation-delay:${0.05*i}s" ${state.answered ? 'disabled' : ''}>
      <span class="option-letter">${letters[i]}</span>
      <span>${opt}</span>
    </button>`;
  }).join('');

  // Explanation
  let explanationHtml = '';
  if (state.answered) {
    const isCorrect = state.selected === q.correct;
    explanationHtml = `<div class="explanation-card ${isCorrect ? 'correct-exp' : 'wrong-exp'}">
      ${isCorrect ? '✅' : '❌'} ${q.explanation}
    </div>`;
  }

  const isLast = state.qIndex >= state.questions.length - 1;
  const nextBtn = state.answered
    ? `<button class="next-btn" id="next-btn">${isLast ? 'Sonuçları Gör 🎉' : 'Sonraki Soru →'}</button>`
    : '';

  const comboHtml = state.combo >= 3
    ? `<div style="margin-top:6px"><span class="combo-badge">🔥 ${state.combo}x Combo!</span></div>`
    : '';

  return `<div class="quiz">
    <div class="quiz-header">
      <div class="quiz-top">
        <div class="back-btn" id="back-map">&#8592;</div>
        <div class="quiz-progress-bg"><div class="quiz-progress-fill" style="width:${progress}%"></div></div>
        <div class="quiz-stats">
          <div class="hearts-display" id="hearts-display">${heartsHtml}</div>
        </div>
      </div>
      ${comboHtml}
    </div>
    <div class="quiz-body">
      <div class="question-num">Soru ${state.qIndex + 1} / ${state.questions.length}</div>
      <div class="question-card"><div class="question-text">${q.text}</div></div>
      <div class="options">${optionsHtml}</div>
      ${explanationHtml}
      ${nextBtn}
    </div>
  </div>`;
}

function renderResult() {
  const stars = calcStars(state.correct);
  const msgs = {
    3: ['Mükemmel! 🎉', 'Tüm soruları doğru yaptın, harikasın!'],
    2: ['Çok İyi! 👏', 'Güzel performans, devam et!'],
    1: ['İyi Deneme! 💪', 'Pratik yaptıkça daha iyi olacaksın!']
  };
  const [title, sub] = msgs[stars];

  const starsHtml = [1,2,3].map((s, i) => {
    const filled = s <= stars;
    return `<span class="result-star${filled ? '' : ' empty'}" style="animation-delay:${0.1+i*0.15}s">${filled ? '⭐' : '☆'}</span>`;
  }).join('');

  return `<div class="result">
    <div class="result-emoji">${stars === 3 ? '🏆' : stars === 2 ? '🎯' : '💪'}</div>
    <div class="result-title">${title}</div>
    <div style="color:var(--text2);font-size:14px;text-align:center;max-width:280px;line-height:1.5">${sub}</div>
    <div class="result-stars">${starsHtml}</div>
    <div class="result-xp-card">
      <div class="result-xp-num">+${state.xpGained} XP</div>
      <div class="result-xp-lbl">Bu Oyundan Kazanılan</div>
      <div class="result-score-row">
        <div class="result-stat">
          <div class="result-stat-val" style="color:var(--green)">${state.correct}</div>
          <div class="result-stat-lbl">Doğru</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-val" style="color:var(--red)">${state.wrong}</div>
          <div class="result-stat-lbl">Yanlış</div>
        </div>
        <div class="result-stat">
          <div class="result-stat-val" style="color:var(--gold)">${persist.xp}</div>
          <div class="result-stat-lbl">Toplam XP</div>
        </div>
      </div>
    </div>
    <div class="result-btns">
      <button class="btn-secondary" id="result-home">🏠 Ana Sayfa</button>
      <button class="btn-primary" id="result-retry">🔄 Tekrar</button>
    </div>
  </div>`;
}

// ============================================================
// EVENTS
// ============================================================
function attachEvents() {
  // Category cards (home)
  document.querySelectorAll('.category-card').forEach(el => {
    el.addEventListener('click', () => {
      state.category = el.dataset.cat;
      state.screen = 'map';
      render();
    });
  });

  // Back to home (map)
  const backHome = document.getElementById('back-home');
  if (backHome) backHome.addEventListener('click', () => { state.screen = 'home'; render(); });

  // Level nodes (map)
  document.querySelectorAll('.level-node').forEach(el => {
    el.addEventListener('click', () => {
      const level = parseInt(el.dataset.level);
      const unlocked = persist.unlocked[state.category] || [1];
      const isUnlocked = unlocked.includes(level);
      const isPremiumLocked = level > 1 && !persist.premium;

      if (isPremiumLocked) {
        state.showPaywall = true;
        render();
        return;
      }
      if (!isUnlocked) return;
      startQuiz(state.category, level);
    });
  });

  // Back to map (quiz)
  const backMap = document.getElementById('back-map');
  if (backMap) backMap.addEventListener('click', () => { state.screen = 'map'; render(); });

  // Option buttons (quiz)
  document.querySelectorAll('.option-btn').forEach(el => {
    el.addEventListener('click', () => {
      if (state.answered) return;
      selectAnswer(parseInt(el.dataset.opt));
    });
  });

  // Next question
  const nextBtn = document.getElementById('next-btn');
  if (nextBtn) nextBtn.addEventListener('click', nextQuestion);

  // Result buttons
  const resultHome = document.getElementById('result-home');
  if (resultHome) resultHome.addEventListener('click', () => { state.screen = 'home'; render(); });

  const resultRetry = document.getElementById('result-retry');
  if (resultRetry) resultRetry.addEventListener('click', () => startQuiz(state.category, state.level));

  // No hearts
  const refill = document.getElementById('refill-hearts');
  if (refill) refill.addEventListener('click', () => {
    persist.hearts = 5;
    savePersist(persist);
    startQuiz(state.category, state.level);
  });

  const backHomeNh = document.getElementById('back-home-nh');
  if (backHomeNh) backHomeNh.addEventListener('click', () => { state.screen = 'home'; render(); });

  // Paywall
  const paywallOverlay = document.getElementById('paywall-overlay');
  if (paywallOverlay) {
    paywallOverlay.addEventListener('click', e => {
      if (e.target === paywallOverlay) { state.showPaywall = false; render(); }
    });
  }

  const paywallClose = document.getElementById('paywall-close');
  if (paywallClose) paywallClose.addEventListener('click', () => { state.showPaywall = false; render(); });

  document.querySelectorAll('.plan-card').forEach(el => {
    el.addEventListener('click', () => {
      state.paywallPlan = el.dataset.plan;
      document.querySelectorAll('.plan-card').forEach(p => p.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  const buyBtn = document.getElementById('buy-btn');
  if (buyBtn) buyBtn.addEventListener('click', () => {
    persist.premium = true;
    savePersist(persist);
    state.showPaywall = false;
    render();
    showToast('🎉 Premium aktif! Tüm seviyelerin kilidi açıldı!');
  });
}

// ============================================================
// QUIZ LOGIC
// ============================================================
function startQuiz(cat, level) {
  state.category = cat;
  state.level = level;
  state.questions = getQuestions(cat, level);
  state.qIndex = 0;
  state.selected = null;
  state.answered = false;
  state.correct = 0;
  state.wrong = 0;
  state.combo = 0;
  state.xpGained = 0;
  state.screen = 'quiz';
  render();
}

function selectAnswer(opt) {
  const q = state.questions[state.qIndex];
  state.selected = opt;
  state.answered = true;
  const isCorrect = opt === q.correct;

  if (isCorrect) {
    state.correct++;
    state.combo++;
    let xp = 10;
    if (state.combo >= 3) xp += 5;
    state.xpGained += xp;
    persist.xp += xp;
    savePersist(persist);
    showFloatingXP(xp);
  } else {
    state.wrong++;
    state.combo = 0;
    persist.hearts = Math.max(0, persist.hearts - 1);
    savePersist(persist);
  }

  render();

  // Check no hearts
  if (!isCorrect && persist.hearts === 0) {
    setTimeout(() => { state.screen = 'nohearts'; render(); }, 1600);
  }
}

function nextQuestion() {
  if (state.qIndex >= state.questions.length - 1) {
    finishQuiz();
  } else {
    state.qIndex++;
    state.selected = null;
    state.answered = false;
    render();
  }
}

function finishQuiz() {
  const stars = calcStars(state.correct);
  const cat = state.category;
  const level = state.level;

  // Level XP reward (only if improving stars)
  if (!persist.stars[cat]) persist.stars[cat] = {};
  const prevStars = persist.stars[cat][level] || 0;
  if (stars > prevStars) {
    const xpBonus = LEVELS[level].xpReward;
    state.xpGained += xpBonus;
    persist.xp += xpBonus;
    persist.stars[cat][level] = stars;
  }

  // Unlock next level if ≥3 correct
  if (state.correct >= 3 && level < 5) {
    if (!persist.unlocked[cat]) persist.unlocked[cat] = [1];
    if (!persist.unlocked[cat].includes(level + 1)) {
      persist.unlocked[cat].push(level + 1);
    }
  }

  savePersist(persist);
  state.screen = 'result';
  render();

  if (stars === 3) setTimeout(spawnConfetti, 300);
}

// ============================================================
// CONFETTI
// ============================================================
function spawnConfetti() {
  const colors = ['#667eea','#764ba2','#f093fb','#f5576c','#4facfe','#00f2fe','#ffd700','#00e676','#ff6b35','#a8edea','#fd79a8','#fdcb6e'];
  const wrapper = document.getElementById('app-wrapper');
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const left = Math.random() * 100;
    const duration = Math.random() * 2 + 2.5;
    const delay = Math.random() * 1.5;
    const w = Math.random() * 10 + 6;
    const h = Math.random() * 14 + 8;
    c.style.cssText = [
      `left:${left}%`,
      `top:-20px`,
      `width:${w}px`,
      `height:${h}px`,
      `background:${color}`,
      `animation-duration:${duration}s`,
      `animation-delay:${delay}s`,
      `transform:rotate(${Math.random()*360}deg)`,
      `border-radius:${Math.random() > 0.5 ? '50%' : '2px'}`
    ].join(';');
    wrapper.appendChild(c);
    setTimeout(() => c.remove(), (duration + delay + 0.5) * 1000);
  }
}

// ============================================================
// FLOATING XP
// ============================================================
function showFloatingXP(amount) {
  const el = document.createElement('div');
  el.className = 'float-xp';
  el.textContent = `+${amount} XP`;
  const wrapper = document.getElementById('app-wrapper');
  const rect = wrapper.getBoundingClientRect();
  el.style.left = `${rect.left + rect.width / 2 - 30}px`;
  el.style.top  = `${rect.top  + rect.height / 2 - 40}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = [
    'position:fixed',
    'bottom:80px',
    'left:50%',
    'transform:translateX(-50%)',
    'background:linear-gradient(135deg,#667eea,#764ba2)',
    'color:#fff',
    'padding:12px 20px',
    'border-radius:16px',
    "font-family:'Poppins',sans-serif",
    'font-size:14px',
    'font-weight:600',
    'z-index:9999',
    'box-shadow:0 8px 30px rgba(102,126,234,0.4)',
    'text-align:center',
    'max-width:320px',
    'width:calc(100% - 40px)',
    'animation:popIn 0.4s var(--spring)'
  ].join(';');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ============================================================
// PWA
// ============================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ============================================================
// INIT
// ============================================================
function init() {
  initParticles();
  render();
  // Auto-advance splash after 1.8s
  setTimeout(() => {
    if (state.screen === 'splash') {
      state.screen = 'home';
      render();
    }
  }, 1800);
}

init();
</script>
