<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCate - Kodlama & Dil Öğrenimi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        /* SENİN VERDİĞİN LOGO - SADECE KENARLARI YUVARLAK */
        .logo-image {
            width: 50px;
            height: 50px;
            border-radius: 15px;  /* Kenarları yuvarlatıldı */
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background: white;
            padding: 8px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 12px 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat {
            background: #f5f5f5;
            padding: 8px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .streak { color: #FF9800; font-weight: bold; }
        .points { color: #4CAF50; font-weight: bold; }

        .category-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .cat-btn {
            flex: 1;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255,255,255,0.9);
            color: #667eea;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 120px;
        }

        .cat-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.02);
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .level-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .level-card:hover:not(.locked) {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .level-number {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .level-name {
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }

        .level-desc {
            font-size: 12px;
            color: #666;
        }

        .lock-icon {
            font-size: 20px;
            margin-top: 10px;
        }

        .question-container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 700px;
            margin: 0 auto;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .question-text {
            font-size: 22px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .options {
            display: grid;
            gap: 12px;
            margin: 30px 0;
        }

        .option {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .option:hover {
            background: #e0e0e0;
            transform: translateX(5px);
        }

        .option.correct {
            background: #4CAF50;
            color: white;
        }

        .option.wrong {
            background: #FF5252;
            color: white;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
        }

        .result-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            margin: 50px auto;
        }

        .result-score {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .stars {
            font-size: 48px;
            margin: 20px 0;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        button:hover {
            background: #5a67d8;
            transform: scale(1.02);
        }

        /* PAYWALL OVERLAY */
        .paywall-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .paywall-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }

        .paywall-crown { font-size: 56px; margin-bottom: 10px; }

        .paywall-title {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .paywall-sub {
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .paywall-features {
            text-align: left;
            background: #f9f9ff;
            border-radius: 16px;
            padding: 18px 22px;
            margin-bottom: 28px;
            list-style: none;
        }

        .paywall-features li {
            padding: 6px 0;
            color: #444;
            font-size: 14px;
        }

        .paywall-features li::before {
            content: "✅ ";
        }

        .plans {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 24px;
        }

        .plan {
            border: 2px solid #e0e0e0;
            border-radius: 18px;
            padding: 18px 12px;
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
        }

        .plan:hover { border-color: #667eea; }

        .plan.selected {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .plan-badge {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .plan-period {
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }

        .plan-price {
            font-size: 28px;
            font-weight: 800;
            color: #333;
        }

        .plan-price span {
            font-size: 15px;
            font-weight: 500;
            color: #888;
        }

        .plan-saving {
            font-size: 11px;
            color: #4CAF50;
            font-weight: 600;
            margin-top: 4px;
        }

        .btn-buy {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0;
        }

        .btn-buy:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(102,126,234,0.5);
        }

        .paywall-dismiss {
            margin-top: 14px;
            background: none;
            color: #aaa;
            font-size: 13px;
            padding: 6px 12px;
            border: none;
            cursor: pointer;
        }

        .paywall-dismiss:hover {
            color: #666;
            background: none;
            transform: none;
        }

        .premium-badge {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #7a4f00;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 9px;
            border-radius: 20px;
            display: inline-block;
            margin-left: 6px;
        }

        /* Success modal */
        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            max-width: 380px;
            animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; }
            .levels-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 18px; }
            .plans { grid-template-columns: 1fr; }
        }
    </style>
</head>

        // ALMANCA SORULARI
        const germanQuestions = {
            1: [ // Seviye 1 - Başlangıç
                { text: "'Merhaba' Almancası nedir?", options: ["Auf Wiedersehen", "Hallo", "Danke", "Bitte"], correct: 1, explanation: "'Hallo' = Merhaba" },
                { text: "'Teşekkür ederim' Almancası?", options: ["Bitte", "Danke", "Tschüss", "Guten Tag"], correct: 1, explanation: "'Danke' = Teşekkür ederim" },
                { text: "'Güle güle' Almancası?", options: ["Hallo", "Danke", "Tschüss", "Guten Morgen"], correct: 2, explanation: "'Tschüss' = Güle güle" },
                { text: "'Evet' Almancası?", options: ["Nein", "Ja", "OK", "Vielleicht"], correct: 1, explanation: "'Ja' = Evet" },
                { text: "'Hayır' Almancası?", options: ["Ja", "Nein", "Nicht", "Nie"], correct: 1, explanation: "'Nein' = Hayır" },
                { text: "'1' sayısı Almanca?", options: ["Eins", "Zwei", "Drei", "Vier"], correct: 0, explanation: "'Eins' = 1" },
                { text: "'2' sayısı Almanca?", options: ["Eins", "Zwei", "Drei", "Vier"], correct: 1, explanation: "'Zwei' = 2" },
                { text: "'3' sayısı Almanca?", options: ["Eins", "Zwei", "Drei", "Vier"], correct: 2, explanation: "'Drei' = 3" },
                { text: "'Günaydın' Almancası?", options: ["Guten Abend", "Gute Nacht", "Guten Morgen", "Guten Tag"], correct: 2, explanation: "'Guten Morgen' = Günaydın" },
                { text: "'İyi günler' Almancası?", options: ["Guten Morgen", "Guten Tag", "Guten Abend", "Gute Nacht"], correct: 1, explanation: "'Guten Tag' = İyi günler" },
                { text: "'Ben' Almancası?", options: ["Du", "Er", "Ich", "Sie"], correct: 2, explanation: "'Ich' = Ben" },
                { text: "'Sen' Almancası?", options: ["Ich", "Du", "Er", "Wir"], correct: 1, explanation: "'Du' = Sen" },
                { text: "'Lütfen' Almancası?", options: ["Danke", "Bitte", "Sorry", "Tschüss"], correct: 1, explanation: "'Bitte' = Lütfen" },
                { text: "'Su' Almancası?", options: ["Wasser", "Bier", "Wein", "Milch"], correct: 0, explanation: "'Wasser' = Su" },
                { text: "'Ekmek' Almancası?", options: ["Brot", "Käse", "Wurst", "Butter"], correct: 0, explanation: "'Brot' = Ekmek" }
            ],
            2: [ // Seviye 2 - Kolay
                { text: "'Adın ne?' Almancası?", options: ["Wie alt bist du?", "Wie heißt du?", "Wo wohnst du?", "Was machst du?"], correct: 1, explanation: "'Wie heißt du?' = Adın ne?" },
                { text: "'Ben Ali' Almancası?", options: ["Ich bin Ali", "Ich heiße Ali", "Beide", "Keines"], correct: 2, explanation: "İkisi de doğru." },
                { text: "'Kaç yaşındasın?' Almancası?", options: ["Wie heißt du?", "Wie alt bist du?", "Woher kommst du?", "Was ist das?"], correct: 1, explanation: "'Wie alt bist du?' = Kaç yaşındasın?" },
                { text: "'Türkiye'den geliyorum' Almancası?", options: ["Ich komme aus Deutschland", "Ich komme aus der Türkei", "Ich bin in Türkei", "Ich wohne in Türkei"], correct: 1, explanation: "'aus der Türkei' = Türkiye'den" },
                { text: "'Güzel' Almancası?", options: ["Schlecht", "Schön", "Groß", "Klein"], correct: 1, explanation: "'Schön' = Güzel" }
            ],
            3: [ // Seviye 3 - Orta
                { text: "'Dönüş yapacağım' Almancası?", options: ["Ich gehe", "Ich komme zurück", "Ich laufe", "Ich springe"], correct: 1, explanation: "'zurückkommen' = geri dönmek" },
                { text: "'Anlamadım' Almancası?", options: ["Ich verstehe nicht", "Ich weiß nicht", "Ich kann nicht", "Ich mache nicht"], correct: 0, explanation: "'Ich verstehe nicht' = Anlamadım" },
                { text: "'Yardım eder misin?' Almancası?", options: ["Kannst du helfen?", "Hilfst du mir?", "Kannst du mir helfen?", "Hilfe!"], correct: 2, explanation: "'Kannst du mir helfen?' = Yardım eder misin?" }
            ],
            4: [ // Seviye 4 - İleri
                { text: "'Schadenfreude' ne demek?", options: ["Başkasının üzüntüsüne sevinme", "Üzüntü", "Mutluluk", "Korku"], correct: 0, explanation: "Başkasının kötü durumuna sevinmek." },
                { text: "'Fernweh' ne demek?", options: ["Ev hasreti", "Uzaklara gitme isteği", "Deniz özlemi", "Dağ hasreti"], correct: 1, explanation: "'Fern' (uzak) + 'Weh' (ağrı) = Uzaklara gitme isteği" }
            ],
            5: [ // Seviye 5 - Uzman
                { text: "'Vergangenheitsbewältigung' ne anlama gelir?", options: ["Gelecek planı", "Geçmişle hesaplaşma", "Şimdiki zaman", "Gelecek korkusu"], correct: 1, explanation: "Almanya'nın Nazi geçmişiyle yüzleşmesi." },
                { text: "'Weltschmerz' ne demek?", options: ["Dünya sevgisi", "Dünya acısı", "Dünya barışı", "Dünya neşesi"], correct: 1, explanation: "Dünyanın kötülüğü karşısında melankoli." }
            ]
        };

        // Seviye eksiklerini tamamla (her seviyede en az 15 soru)
        for (let level = 1; level <= 5; level++) {
            while (codingQuestions[level].length < 15) {
                codingQuestions[level].push(...codingQuestions[level].slice(0, 5));
            }
            codingQuestions[level] = codingQuestions[level].slice(0, 15);
            
            while (englishQuestions[level].length < 15) {
                englishQuestions[level].push(...englishQuestions[level].slice(0, 5));
            }
            englishQuestions[level] = englishQuestions[level].slice(0, 15);
            
            while (germanQuestions[level].length < 15) {
                germanQuestions[level].push(...germanQuestions[level].slice(0, 5));
            }
            germanQuestions[level] = germanQuestions[level].slice(0, 15);
        }

        // ==================== PAYWALL ====================
        let isPremium = JSON.parse(localStorage.getItem('eduKella_premium') || 'false');
        let selectedPlan = 'yearly';

        function showPaywall(onSuccess) {
            const overlay = document.createElement('div');
            overlay.className = 'paywall-overlay';
            overlay.id = 'paywallOverlay';
            overlay.innerHTML = `
                <div class="paywall-card">
                    <div class="paywall-crown">👑</div>
                    <div class="paywall-title">EduCate Premium</div>
                    <div class="paywall-sub">Tüm seviyelerin kilidini aç, sınırsız öğren!</div>
                    <ul class="paywall-features">
                        <li>Seviye 2, 3, 4 ve 5'e tam erişim</li>
                        <li>3 kategoride 200+ soru</li>
                        <li>Detaylı açıklamalar ve ipuçları</li>
                        <li>İlerleme kaydı ve rozetler</li>
                        <li>Reklamsız deneyim</li>
                    </ul>
                    <div class="plans">
                        <div class="plan ${selectedPlan === 'monthly' ? 'selected' : ''}" onclick="selectPlan('monthly')">
                            <div class="plan-period">Aylık</div>
                            <div class="plan-price">₺49<span>/ay</span></div>
                            <div class="plan-saving">&nbsp;</div>
                        </div>
                        <div class="plan ${selectedPlan === 'yearly' ? 'selected' : ''}" onclick="selectPlan('yearly')">
                            <div class="plan-badge">🔥 En Popüler</div>
                            <div class="plan-period">Yıllık</div>
                            <div class="plan-price">₺299<span>/yıl</span></div>
                            <div class="plan-saving">%49 tasarruf et</div>
                        </div>
                    </div>
                    <button class="btn-buy" onclick="handlePurchase()">
                        🚀 Hemen Başla
                    </button>
                    <br>
                    <button class="paywall-dismiss" onclick="closePaywall()">Şimdi değil</button>
                </div>
            `;
            document.body.appendChild(overlay);
            window._paywallCallback = onSuccess;
        }

        window.selectPlan = (plan) => {
            selectedPlan = plan;
            document.querySelectorAll('.plan').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('.plan')[plan === 'monthly' ? 0 : 1].classList.add('selected');
        };

        window.closePaywall = () => {
            const overlay = document.getElementById('paywallOverlay');
            if (overlay) overlay.remove();
        };

        window.handlePurchase = () => {
            closePaywall();
            // Simulate payment success (replace with real payment gateway)
            isPremium = true;
            localStorage.setItem('eduKella_premium', 'true');
            showSuccessModal();
        };

        function showSuccessModal() {
            const el = document.createElement('div');
            el.className = 'success-overlay';
            el.innerHTML = `
                <div class="success-card">
                    <div style="font-size:72px">🎉</div>
                    <h2 style="color:#667eea;margin:16px 0 8px">Premium Aktif!</h2>
                    <p style="color:#666;margin-bottom:28px">Artık tüm seviyelere erişebilirsin. İyi öğrenmeler!</p>
                    <button class="btn-buy" onclick="this.closest('.success-overlay').remove(); render();">Harika, başlayalım!</button>
                </div>
            `;
            document.body.appendChild(el);
        }

        // ==================== UYGULAMA DURUMU ====================
        let currentCategory = 'coding';
        let currentLevel = null;
        let unlockedLevels = JSON.parse(localStorage.getItem('unlockedLevels_educate') || '{"coding": [1], "english": [1], "german": [1]}');
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let userPoints = JSON.parse(localStorage.getItem('userPoints_educate') || '{"coding": 0, "english": 0, "german": 0}');
        
        // Kullanılmış soruları takip et (ard arda aynı soru gelmesin diye)
        let usedQuestionsHistory = { coding: {}, english: {}, german: {} };

        function getRandomQuestions(category, level, count = 5) {
            let pool;
            if (category === 'coding') pool = codingQuestions[level];
            else if (category === 'english') pool = englishQuestions[level];
            else pool = germanQuestions[level];
            
            // Daha önce kullanılan soruların ID'lerini al
            const historyKey = `${category}_${level}`;
            if (!usedQuestionsHistory[category]) usedQuestionsHistory[category] = {};
            if (!usedQuestionsHistory[category][level]) usedQuestionsHistory[category][level] = [];
            
            const usedIds = usedQuestionsHistory[category][level];
            
            // Kullanılmayan soruları filtrele
            let available = pool.filter((_, idx) => !usedIds.includes(idx));
            
            // Eğer kullanılmayan soru kalmadıysa, history'yi sıfırla
            if (available.length < count) {
                usedQuestionsHistory[category][level] = [];
                available = [...pool];
            }
            
            // Rastgele seç
            const shuffled = [...available];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            
            const selected = shuffled.slice(0, count);
            
            // Seçilen soruları history'e ekle
            selected.forEach(q => {
                const idx = pool.findIndex(p => p.text === q.text);
                if (!usedQuestionsHistory[category][level].includes(idx)) {
                    usedQuestionsHistory[category][level].push(idx);
                }
            });
            
            return selected;
        }

        function unlockLevel(category, level) {
            if (!unlockedLevels[category].includes(level)) {
                unlockedLevels[category].push(level);
                localStorage.setItem('unlockedLevels_educate', JSON.stringify(unlockedLevels));
            }
        }

        function checkAndUnlockNextLevel() {
            const nextLevel = currentLevel + 1;
            if (nextLevel <= 5 && score >= 40) {
                if (!unlockedLevels[currentCategory].includes(nextLevel)) {
                    unlockLevel(currentCategory, nextLevel);
                    alert(`🎉 Tebrikler! ${getCategoryName()} Seviye ${nextLevel} açıldı! 🎉`);
                }
            }
        }

        function savePoints() {
            userPoints[currentCategory] += score;
            localStorage.setItem('userPoints_educate', JSON.stringify(userPoints));
        }

        function getCategoryName() {
            const names = { coding: '💻 Kodlama', english: '🇬🇧 İngilizce', german: '🇩🇪 Almanca' };
            return names[currentCategory];
        }

        function render() {
            if (currentLevel === null) {
                renderCategorySelect();
            } else if (currentQuestionIndex < currentQuestions.length) {
                renderQuestion();
            } else {
                renderResult();
            }
        }

        function renderCategorySelect() {
            const levelNames = ['🥉 Başlangıç', '📘 Kolay', '📙 Orta', '📗 İleri', '🏆 Uzman'];
            const levelDescs = ['Temel kavramlar', 'Pratik bilgiler', 'Problem çözme', 'Derin konular', 'Uzmanlık'];
            
            app.innerHTML = `
                <div class="container">
                    <div class="header">
                        <div class="logo-container">
                            ${logoHtml}
                            <span class="logo-text">EduCate</span>
                        </div>
                        <div class="stats">
                            ${isPremium
                                ? `<div class="stat" style="background:#fff8e1;color:#f59e0b;font-weight:bold;">👑 Premium</div>`
                                : `<div class="stat" style="cursor:pointer;" onclick="showPaywall()">🔓 Ücretsiz</div>`}
                            <div class="stat points">⭐ Toplam: ${userPoints.coding + userPoints.english + userPoints.german} puan</div>
                            <div class="stat points">💻 ${userPoints.coding}</div>
                            <div class="stat points">🇬🇧 ${userPoints.english}</div>
                            <div class="stat points">🇩🇪 ${userPoints.german}</div>
                        </div>
                    </div>
                    
                    <div class="category-selector">
                        <button class="cat-btn coding ${currentCategory === 'coding' ? 'active' : ''}" onclick="selectCategory('coding')">
                            💻 Kodlama
                        </button>
                        <button class="cat-btn english ${currentCategory === 'english' ? 'active' : ''}" onclick="selectCategory('english')">
                            🇬🇧 İngilizce
                        </button>
                        <button class="cat-btn german ${currentCategory === 'german' ? 'active' : ''}" onclick="selectCategory('german')">
                            🇩🇪 Almanca
                        </button>
                    </div>
                    
                    <h2 style="color: white; text-align: center; margin-bottom: 20px;">📖 Seviye Seç - ${getCategoryName()}</h2>
                    <div class="levels-grid">
                        ${[1,2,3,4,5].map(level => {
                            const isUnlocked = unlockedLevels[currentCategory].includes(level);
                            const needsPremium = level > 1 && !isPremium;
                            const clickable = isUnlocked && !needsPremium;
                            return `
                            <div class="level-card ${!isUnlocked || needsPremium ? 'locked' : ''}"
                                 onclick="${needsPremium ? `showPaywall()` : clickable ? `startLevel(${level})` : ''}">
                                <div class="level-number">${level}</div>
                                <div class="level-name">${levelNames[level-1]}${needsPremium ? '<span class="premium-badge">PRO</span>' : ''}</div>
                                <div class="level-desc">${levelDescs[level-1]}</div>
                                <div class="lock-icon">${needsPremium ? '👑' : !isUnlocked ? '🔒' : '🔓'}</div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            app.innerHTML = `
                <div class="container">
                    <div class="question-container">
                        <div class="question-header">
                            <span>${getCategoryName()} • Seviye ${currentLevel}</span>
                            <span>Soru ${currentQuestionIndex + 1}/${currentQuestions.length}</span>
                            <span>⭐ ${score} puan</span>
                        </div>
                        <div class="question-text">${q.text}</div>
                        <div class="options">
                            ${q.options.map((opt, idx) => `
                                <div class="option" onclick="checkAnswer(${idx})">
                                    ${String.fromCharCode(65+idx)}. ${opt}
                                </div>
                            `).join('')}
                        </div>
                        <div id="feedback"></div>
                    </div>
                </div>
            `;
        }

        function renderResult() {
            const percentage = (score / (currentQuestions.length * 10)) * 100;
            const stars = percentage >= 90 ? '⭐⭐⭐⭐⭐' : percentage >= 70 ? '⭐⭐⭐⭐' : percentage >= 50 ? '⭐⭐⭐' : percentage >= 30 ? '⭐⭐' : '⭐';
            const message = percentage >= 70 ? '🎉 Harika! Bir sonraki seviyeye geçebilirsin!' : '📚 Tekrar dene, daha iyi yapabilirsin!';
            
            app.innerHTML = `
                <div class="container">
                    <div class="result-card">
                        ${logoHtml}
                        <h2>🎓 ${getCategoryName()} Seviye ${currentLevel} Tamamlandı!</h2>
                        <div class="result-score">${score}/${currentQuestions.length * 10}</div>
                        <div class="stars">${stars}</div>
                        <p>${message}</p>
                        <button onclick="finishLevel()">🏠 Ana Menüye Dön</button>
                        ${percentage >= 70 && currentLevel < 5 ? `<button onclick="nextLevel()" style="background: #4CAF50;">🚀 Sonraki Seviye →</button>` : ''}
                    </div>
                </div>
            `;
        }

        window.selectCategory = (category) => {
            currentCategory = category;
            currentLevel = null;
            render();
        };

        window.startLevel = (level) => {
            if (level > 1 && !isPremium) { showPaywall(); return; }
            currentLevel = level;
            currentQuestions = getRandomQuestions(currentCategory, level, 5);
            currentQuestionIndex = 0;
            score = 0;
            render();
        };

        window.checkAnswer = (selectedIndex) => {
            const q = currentQuestions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.correct;
            const optionsDivs = document.querySelectorAll('.option');
            
            optionsDivs.forEach(div => div.style.pointerEvents = 'none');
            
            if (isCorrect) {
                score += 10;
                optionsDivs[selectedIndex].classList.add('correct');
                document.getElementById('feedback').innerHTML = `
                    <div class="feedback" style="background: #e8f5e9;">
                        ✅ Doğru! +10 puan<br>
                        <small>📖 ${q.explanation}</small>
                    </div>
                `;
            } else {
                optionsDivs[selectedIndex].classList.add('wrong');
                optionsDivs[q.correct].classList.add('correct');
                document.getElementById('feedback').innerHTML = `
                    <div class="feedback" style="background: #ffebee;">
                        ❌ Yanlış! Doğru cevap: ${q.options[q.correct]}<br>
                        <small>📖 ${q.explanation}</small>
                    </div>
                `;
            }
            
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < currentQuestions.length) {
                    renderQuestion();
                } else {
                    savePoints();
                    checkAndUnlockNextLevel();
                    render();
                }
            }, 2000);
        };

        window.finishLevel = () => {
            currentLevel = null;
            render();
        };

        window.nextLevel = () => {
            if (currentLevel + 1 <= 5 && unlockedLevels[currentCategory].includes(currentLevel + 1)) {
                startLevel(currentLevel + 1);
            } else {
                finishLevel();
            }
        };

        render();
    </script>
</body>
</html>
